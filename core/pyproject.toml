[project]
name = "urag-core"
version = "0.1.0"
description = "Moteur Universal RAG : ingestion, recherche, RAG, permissions, citations, routeur IA"
requires-python = ">=3.12"
dependencies = [
    "urag-connectors-base",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "pyjwt>=2.10",
    "httpx>=0.28",
    "qdrant-client>=1.12",
    "pypdfium2>=4.30",
    "python-docx>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
