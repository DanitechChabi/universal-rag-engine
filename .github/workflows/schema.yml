name: Schéma PostgreSQL

on:
  push:
    paths: ["database/**", ".github/workflows/schema.yml"]
  pull_request:
    paths: ["database/**", ".github/workflows/schema.yml"]

jobs:
  test-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Client PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Tests du schéma
        run: ./database/tests/test_schema.sh
