name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres-dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.15.4
        env:
          QDRANT__SERVICE__API_KEY: dev-qdrant-key
        ports: ["6333:6333"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: OCR (Tesseract, moteur par défaut, ADR-0017)
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng
      - name: Dépendances
        run: uv sync --locked --python 3.12
      - name: Style
        run: uv run ruff check . && uv run ruff format --check .
      - name: Tests unitaires et d'intégration
        # Le test avec les vrais modèles est ignoré automatiquement sans Ollama.
        run: uv run pytest -q -p no:warnings
