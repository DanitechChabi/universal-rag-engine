[project]
name = "urag-worker"
version = "0.1.0"
description = "Service d'exécution des tâches Universal RAG"
requires-python = ">=3.12"
dependencies = ["urag-core", "urag-connector-local-files"]

[project.scripts]
urag-worker = "urag_worker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
