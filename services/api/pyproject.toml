[project]
name = "urag-api"
version = "0.1.0"
description = "API REST Universal RAG (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "urag-core",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "prometheus-client>=0.21",
]

[project.scripts]
urag-api = "urag_api.main:run"
urag-admin = "urag_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
